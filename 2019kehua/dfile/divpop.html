<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">	
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta http-equiv="Content-Language" content="zh-tw"/>
	<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JS CSS實現的Div彈出視窗，同時背景變暗</title>
<script>  
  function locking(){  
   document.getElementById("ly").style.display="block";     
   document.getElementById("Layer2").style.display="block"; 
   }  
  function Lock_CheckForm(theForm){  
   document.getElementById("ly").style.display="none";
   document.getElementById("Layer2").style.display="none";
  return   false;  
   }  
</script>
<style type="text/css">

.STYLE1 {font-size: 12px}
a:link {
color: #000;
text-decoration: none;
}
a:visited {
text-decoration: none;
}
a:hover {
text-decoration: none;
}
a:active {
text-decoration: none;
}

</style>
</head>
<body>
    <p align="center">
        <input type="button" value="彈出DIV" onClick="locking()" />
    </p>
  <div id="ly" style="width:100%;height:100%;position:absolute;top:0px; opacity:0.7;filter:alpha(opacity=70);;background-color:#333;z-index:1;left:0px;display:none;"></div>
 
    <div id="Layer2" align="center" style="position:absolute;z-index:3;background-color: #fff; display: none;top:20%;left:30%" >
        <table width="540" height="300" border="0" cellpadding="0" cellspacing="0" style="border:0 solid #e7e3e7;border-collapse:collapse;" >
            <tr>
                <td style="background-color:#73A2d6;color:#fff;padding-left:4px;padding-top: 2px;font-weight: bold;font-size:12px;" height="10" valign="middle">
                     <div align="right"><a href="JavaScript:void(0);" class="STYLE1" onclick="Lock_CheckForm(this);">關閉</a>     </div></td>
            </tr>
            <tr>
                <td height="130" align="center">
<br><br><hr><p align="center"><font color="red">本特效收集於網際網路，只為興趣與學習交流，不作商業用途。來源：指令碼之家</font></p>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
